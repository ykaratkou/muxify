name: Build and release beta

on:
  push:
    branches: [master, main]
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing beta tag (for example v0.1.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate beta tag and toolchain
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch || "$GITHUB_REF" = refs/tags/* ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$ ]]
          fi
          [[ "$(uname -m)" = arm64 ]]
          xcodebuild -version

      - name: Cache pinned Ghostty library, resources, and notices
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ghostty
          key: ghostty-macos-26-arm64-xcode-26.6-${{ hashFiles('scripts/ghostty-version.env', 'scripts/setup-ghostty.sh', 'scripts/collect-notices.py') }}

      - name: Test release tooling
        run: python3 -m unittest discover -s Tests/ReleaseTests -v

      - name: Prepare dependencies
        run: make setup

      - name: Test Muxify
        timeout-minutes: 10
        env:
          NSUnbufferedIO: 'YES'
        run: make test

      - name: Build and package ad-hoc-signed beta
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Upload beta package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-package
          path: build/releases/${{ env.RELEASE_TAG }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: beta-package
          path: dist

      - name: Publish GitHub prerelease
        run: |
          # Do not replace an existing release or its already-downloaded assets.
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS dist/build-info.json \
            --verify-tag --prerelease --latest=false --title "Muxify ${RELEASE_TAG#v}" \
            --notes-file dist/RELEASE-NOTES.md
